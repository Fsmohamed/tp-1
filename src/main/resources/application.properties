spring.application.name=compte-service
server.port=8080

# Configuration Base de données H2
spring.datasource.url=jdbc:h2:mem:comptedb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Activation Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Configuration Spring Data REST
spring.data.rest.base-path=/rest
spring.data.rest.default-page-size=20

# Configuration Swagger / OpenAPI
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
